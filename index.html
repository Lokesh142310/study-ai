<!DOCTYPE html>
<html>
<head>
  <title>MAX AI Study System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px;
    }

    textarea {
      width: 90%;
      height: 150px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
    }

    button {
      margin: 10px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #00c6ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: white;
      transform: scale(1.05);
    }

    #mainApp {
      display: none;
    }

    .login-box {
      margin-top: 100px;
    }

    input {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    h1 {
      font-size: 40px;
      text-shadow: 0 0 15px #00f7ff;
    }
  </style>
</head>

<body>

<div class="login-box" id="loginBox">
  <h1>MAX AI Secure Login</h1>
  <input type="text" id="username" placeholder="Username"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<div id="mainApp" class="container">
  <h1>❄ MAX AI Study Generator</h1>

  <textarea placeholder="Paste your study notes here..."></textarea><br>

  <button>Summary</button>
  <button>Mind Map</button>
  <button>Quiz</button>
  <button>Flashcards</button>
  <button>Slide Deck</button>
  <button>Infographic</button>
  <button>Data Table</button>
  <button>Video Review</button>
  <button>Audio Review</button>
</div>

<script>
  const correctUsername = "Lokesh";
  const correctPassword = "MAX1423";

  function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(user === correctUsername && pass === correctPassword){
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
    } else {
      alert("Access Denied");
    }
  }
</script>

</body>
</html>
